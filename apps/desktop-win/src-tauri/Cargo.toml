[package]
name = "klorn-desktop-win"
version = "0.2.0"
description = "Klorn for Windows — a thin shell around the hosted web app"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: close-to-tray (src/tray.rs).
tauri = { version = "2", features = ["tray-icon"] }
# One running copy. A second launch focuses the existing window instead of
# opening a second inbox that fights the first over notifications.
tauri-plugin-single-instance = "2"
# System-browser handoff for Google OAuth (RFC 8252: Google rejects OAuth in
# embedded webviews). The web app calls this through the injected IPC global —
# see packages/web/src/lib/native/shell.ts.
tauri-plugin-opener = "2"
# OS banners for PUSH mail / meetings starting soon, posted from Rust by the
# shell's show_banner command (src/banner.rs). None of the plugin's commands
# are granted to the remote origin — see capabilities/default.json.
tauri-plugin-notification = "2"
# Tray menu language (en/ko) without pulling the web app's i18n into Rust.
sys-locale = "0.3"
