# Self-host production stack — postgres + api + web on one machine.
#
# This file is for RUNNING Klorn as your own service (a VPS, a home server).
# For local development, use docker-compose.yml + the README "Local
# development" flow instead — that one binds dev ports and dev credentials.
#
# Usage:
#   cp .env.selfhost.example .env.selfhost      # then fill in the values
#   docker compose --env-file .env.selfhost -f docker-compose.selfhost.yml up -d
#
# api and web pull prebuilt images from ghcr.io — no toolchain, no source
# build. To build from source instead (e.g. you changed the code, or you
# serve web beyond localhost and must rebake NEXT_PUBLIC_API_URL), swap the
# `image:` line for the commented `build:` block on that service.
#
# Migrations run automatically: the api image's entrypoint
# (packages/api/scripts/start.sh) executes `prisma migrate deploy` with
# cold-start retry before starting the server, so a fresh `up` creates the
# schema by itself. The Prisma client is generated at image build time
# (Dockerfile.api).
#
# Full guide (OAuth client setup, env reference, updates): docs/self-hosting.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klorn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}
      POSTGRES_DB: klorn
    # Intentionally NOT published to the host — the api reaches it over the
    # compose network. Uncomment to expose for psql/backups from the host:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - klorn-selfhost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klorn"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/k08200/klorn-api:latest
    # To build from source, remove the image: line and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # NODE_ENV=production keeps every insecure dev fallback OFF (see
      # packages/api/src/env.ts — anything that isn't development/test fails
      # closed; missing JWT_SECRET / TOKEN_ENCRYPTION_KEY aborts boot).
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://klorn:${POSTGRES_PASSWORD}@postgres:5432/klorn

      # ── Required secrets ─────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.selfhost}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY (base64 32 bytes) in .env.selfhost}

      # ── Google OAuth (your own client — see docs/self-hosting.md) ────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env.selfhost}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env.selfhost}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/auth/google/callback}

      # ── LLM provider (set at least one; local-first is supported) ────
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}

      # ── URLs the API must know about ─────────────────────────────────
      # Where the browser reaches the web app (OAuth redirects land here).
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # Browser origins allowed to call the API with credentials. Must
      # include the web app origin — production fails CLOSED without it.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # ── Optional: real-time Gmail push (polling fallback otherwise) ──
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GMAIL_PUSH_OIDC_EMAIL: ${GMAIL_PUSH_OIDC_EMAIL:-}
      GMAIL_PUSH_TOKEN: ${GMAIL_PUSH_TOKEN:-}

      # ── Optional: notifications ──────────────────────────────────────
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}

      # ── Optional: operator conveniences ──────────────────────────────
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
    # /api/health is liveness: it answers 200 and reports
    # {status: "ok" | "degraded"} in the body, so a status-code probe would call
    # the API healthy while Postgres is unreachable. Parse the body instead
    # (/api/health/ready answers 503 then, for status-code monitors).
    # node:22-slim ships neither curl nor wget; node's global fetch is the one
    # thing guaranteed to be in this image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/k08200/klorn-web:latest
    # NEXT_PUBLIC_API_URL is inlined into the client bundle at BUILD time —
    # a runtime env entry cannot change it. The published image is baked
    # with the single-host default (http://localhost:3001). If browsers
    # reach your API at any other address (reverse proxy, separate host),
    # remove the image: line and rebuild from source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.web
    #   args:
    #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    # The web app has no /health route, so the probe is the root page actually
    # rendering. start_period covers the first render on a cold boot.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    # service_healthy, not start-order: without it a reverse proxy can route to
    # web before it serves, and web can call an API that is still migrating.
    depends_on:
      api:
        condition: service_healthy

volumes:
  klorn-selfhost-pgdata:
