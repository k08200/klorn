# Version updates. Security updates are enabled separately in repo settings
# and run regardless of this file. Advisory fixes for production deps are
# what un-reds the blocking audit job in security-deep.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    # Biome is version-locked to the CI Lint job's setup-biome pin — bumping
    # one without the other splits local vs CI lint judgments (hit twice on
    # 2026-08-13, PR #1081). Bump both together, manually.
    ignore:
      - dependency-name: "@biomejs/biome"
      # Prisma 7 needs a planned migration (driver adapter, prisma.config.ts,
      # migrate diff flags, P2010 error shapes, pg pool/TLS defaults), and the
      # CLI and client must move together. A lone client major bump (#1289)
      # fails `prisma generate`. Minor/patch updates still flow; remove these
      # two entries when the migration lands.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # @types/node must describe the Node the code runs on, and that is 22
      # everywhere: render.yaml NODE_VERSION, Dockerfile.api/.web node:22-slim,
      # CI setup-node. Types for a newer major type-check calls to APIs Node 22
      # does not have, so a real runtime break compiles cleanly (#1678 offered
      # 26). api/web currently sit on ^25 — realigning them to ^22 is separate
      # work. Raise this bound in the same change that moves the runtime.
      - dependency-name: "@types/node"
        versions: [">=23"]
    # One PR per batch of routine bumps — review load stays flat. Security
    # updates are never grouped by Dependabot and still arrive individually.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
