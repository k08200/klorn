# Build the native macOS app and publish it as a downloadable GitHub Release.
#
# Trigger: push a tag like `desktop-v0.1.0` (or run manually via workflow_dispatch).
#
# Signing/notarization is OPTIONAL — the job runs either way:
#   • With the secrets below present → Developer-ID signed + Apple-notarized +
#     stapled, so the download opens with a plain double-click.
#   • Without them → the ad-hoc-signed build make-app.sh already produces; the
#     Release notes tell users to right-click → Open (Gatekeeper) once.
#
# Required repo Secrets for a notarized build (Settings › Secrets › Actions):
#   MACOS_DEVELOPER_ID_CERT_P12_BASE64  base64 of your Developer ID Application .p12
#   MACOS_DEVELOPER_ID_CERT_PASSWORD    the .p12 export password
#   MACOS_SIGN_IDENTITY                 e.g. "Developer ID Application: Name (P89M32649C)"
#   MACOS_NOTARY_APPLE_ID              Apple ID email used for notarytool
#   MACOS_NOTARY_TEAM_ID              your Team ID (P89M32649C)
#   MACOS_NOTARY_APP_PASSWORD         an app-specific password for that Apple ID
#
# The build is universal (arm64 + x86_64) via KLORN_ARCHS, so it runs on Intel
# Macs as well as Apple Silicon. A host-arch build shipped an arm64-only binary
# that could not launch on Intel at all.
#
# Two assets ship, and both are load-bearing:
#   • Klorn.dmg  — the human install path. Its Applications symlink is what gets
#     people to move the app before first launch; without that the app runs
#     translocated and SelfUpdate can never find an install target, so in-app
#     updates fail permanently for that user.
#   • Klorn-macos.zip — the update channel. SelfUpdate.releaseZipURL() downloads
#     this exact asset by name, so renaming or dropping it silently breaks
#     updates for every already-installed copy.

name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. desktop-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build & publish Klorn.app
    # macos-15 ships Swift 6 (Package.swift is swift-tools 6.0); macos-14's default
    # is Swift 5.10, which can't parse the manifest.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select a Swift 6 toolchain
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          swift --version

      - name: Resolve release tag
        id: meta
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID secrets set — publishing an ad-hoc (non-notarized) build."
          fi

      - name: Build Klorn.app (universal)
        working-directory: apps/desktop-mac
        # 3rd arg = bundle version from the tag, so the in-app update check
        # compares real versions (a hardcoded one would nag forever).
        run: scripts/make-app.sh release "https://klorn-api.onrender.com" "${TAG#desktop-v}"
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          KLORN_ARCHS: "arm64 x86_64"

      - name: Verify both architectures shipped
        working-directory: apps/desktop-mac
        # make-app.sh already asserts this, but a named step puts the archs in the
        # log and makes a dropped slice obvious in the checks UI rather than
        # buried in build output.
        run: |
          ARCHS=$(lipo -archs Klorn.app/Contents/MacOS/KlornMac)
          echo "architectures: $ARCHS"
          for want in arm64 x86_64; do
            tr ' ' '\n' <<< "$ARCHS" | grep -qx "$want" \
              || { echo "::error::release binary is missing the $want slice"; exit 1; }
          done

      - name: Self-check the PACKAGED app
        working-directory: apps/desktop-mac
        # `swift run --self-check` in CI tests the code but not the packaging:
        # 80024–80028 all passed it and still crashed at launch because
        # make-app.sh shipped the app without the SwiftPM resource bundle, so
        # Bundle.module fatalErrored on the first L10n lookup. Running the
        # self-check through the ASSEMBLED bundle exercises that exact path
        # (SelfCheck calls L(...)), so a packaging regression fails the release
        # instead of shipping an app that dies on its first menu.
        run: ./Klorn.app/Contents/MacOS/KlornMac --self-check

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put the build keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign with Developer ID (hardened runtime)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/desktop-mac
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          # Re-sign the whole bundle with the Developer ID over make-app.sh's
          # ad-hoc signature. --options runtime (hardened runtime) + --timestamp
          # (secure timestamp) are both notarization requirements. The app is a
          # single Mach-O with no nested frameworks, so signing the bundle
          # covers its only executable — no inside-out walk needed.
          # Klorn.entitlements grants the hardened runtime calendar access (step C6,
          # EventKit); without it macOS refuses the device-calendar upload silently.
          codesign --force --options runtime --timestamp --entitlements Klorn.entitlements \
            --sign "$SIGN_IDENTITY" Klorn.app
          codesign --verify --strict --verbose=2 Klorn.app
          # Fail early if the hardened runtime flag didn't take (notarization
          # would reject it minutes later with a vaguer error).
          codesign -d --verbose=2 Klorn.app 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime flag missing after signing"; exit 1; }

      - name: Notarize & staple
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/desktop-mac
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent Klorn.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple Klorn.app

      - name: Verify Gatekeeper acceptance (the real double-click gate)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/desktop-mac
        run: |
          # notarytool "Accepted" only means Apple ingested the binary; it does
          # NOT prove the stapled ticket + signature actually pass Gatekeeper on
          # a user's Mac. Assert that here so a mis-signed build fails the
          # release loudly instead of shipping a "notarized" app that still
          # bounces at first launch. -vvv prints "source=Notarized Developer ID".
          spctl --assess --type execute -vvv Klorn.app
          stapler validate Klorn.app

      # Both packages are built from the app AFTER it has been signed, notarized
      # and stapled, so each carries the ticket and opens offline.
      - name: Zip for the in-app updater
        working-directory: apps/desktop-mac
        run: ditto -c -k --keepParent Klorn.app "$RUNNER_TEMP/Klorn-macos.zip"

      - name: Build the DMG
        working-directory: apps/desktop-mac
        run: scripts/make-dmg.sh Klorn.app "$RUNNER_TEMP/Klorn.dmg" Klorn

      - name: Sign, notarize & staple the DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          # The container needs its own signature and ticket. A notarized app
          # inside an unnotarized DMG still trips Gatekeeper on the DMG itself,
          # before the user ever reaches the app.
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$RUNNER_TEMP/Klorn.dmg"
          xcrun notarytool submit "$RUNNER_TEMP/Klorn.dmg" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/Klorn.dmg"

      - name: Verify the DMG passes Gatekeeper
        if: steps.signing.outputs.enabled == 'true'
        run: |
          # A disk image is assessed as "open", not "execute", and needs the
          # primary-signature context — `--type execute` on a .dmg reports a
          # misleading pass.
          spctl --assess --type open \
            --context context:primary-signature -vvv "$RUNNER_TEMP/Klorn.dmg"
          stapler validate "$RUNNER_TEMP/Klorn.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Native macOS app — the always-on top-bar firewall (a slim pill at the top of your screen that expands with \`⌥⌘K\`)."
            echo
            echo "## Install"
            echo "1. Download \`Klorn.dmg\` and open it."
            echo "2. **Drag \`Klorn.app\` onto Applications.** Running it straight from the disk image"
            echo "   leaves it translocated, and in-app updates cannot find an install location."
            if [ "$SIGNED" = "true" ]; then
              echo "3. Launch it — Developer ID signed and notarized by Apple, so a plain double-click just works."
            else
              echo "3. This build is **ad-hoc signed (not notarized)**, so macOS quarantines a web download and shows \"Klorn.app is damaged.\" Clear the quarantine once:"
              echo '   ```'
              echo "   xattr -dr com.apple.quarantine /Applications/Klorn.app"
              echo '   ```'
              echo "4. Launch \`Klorn.app\`."
              echo
              echo "> A notarized build opens with a plain double-click (no \`xattr\`) — configure the Developer-ID/notary secrets and re-tag (see \`apps/desktop-mac/README.md\`)."
            fi
            echo
            echo "Universal binary — Apple Silicon and Intel. Requires macOS 14+."
            echo "Points at the prod API by default (\`KLORN_API_URL\` overrides)."
            echo
            echo "<sub>\`Klorn-macos.zip\` is the same build, kept as the channel the in-app updater"
            echo "downloads. Install from the DMG.</sub>"
          } > "$NOTES"
          gh release create "$TAG" \
            "$RUNNER_TEMP/Klorn.dmg#Klorn.app (macOS 14+, universal)" \
            "$RUNNER_TEMP/Klorn-macos.zip#Same build, zipped (in-app updater channel)" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Klorn Desktop $TAG" \
            --notes-file "$NOTES"
