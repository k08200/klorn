name: Security

# PR-facing security gate — one fast job (~15s). The slow, non-gating scans
# (CodeQL, dependency audit) live in security-deep.yml on push-to-main + a
# cron (audit daily, CodeQL weekly) so they never occupy a row in the PR
# checks list.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The SHA pin freezes the action's script, not the scanner: it runs
      # `docker run ghcr.io/trufflesecurity/trufflehog:<version>`, and `version`
      # defaults to `latest`. Pin the image of the same release by digest; bump
      # both together (check-actions-pinned.mjs fails a pin bump that leaves
      # this behind).
      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --only-verified
          version: 3.100.1@sha256:9c7a8325d43a4af2960d3f21d61a08981d8a1bf0542e007efa2e47097e386452

      - name: Check for .env files in commits
        run: |
          if find packages/ -name ".env" -o -name ".env.local" -o -name ".env.production" | grep -q .; then
            echo "::error::Found .env files in repository! These should be in .gitignore"
            exit 1
          fi

      - name: Check for hardcoded credentials patterns
        run: |
          PATTERNS="password\s*=\s*['\"][^'\"]+['\"]|api[_-]?key\s*=\s*['\"][^'\"]+['\"]|secret\s*=\s*['\"][^'\"]+['\"]"
          if grep -rEn "$PATTERNS" packages/ --include="*.ts" --include="*.tsx" \
            | grep -v "node_modules" \
            | grep -v "\.d\.ts" \
            | grep -v "placeholder\|example\|test\|mock\|TODO\|process\.env\|env\.\|getenv\|import" \
            | grep -v "password.*=.*\"\"" \
            | head -20; then
            echo "::warning::Potential hardcoded credentials found — review above matches"
          fi
