name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Heavy jobs run in PARALLEL behind a ~10s Scope probe, so PR wall-clock is the
# slowest single job (build), not the sum of a serial chain. The founder runs
# the full gate locally before pushing (CLAUDE.md ship workflow); CI is the
# backstop, so fail-fast ordering buys little and costs minutes.
#
# Scope exists because required checks + path filters don't mix on GitHub: a
# path-filtered workflow leaves its required checks "Expected" forever and the
# PR can never merge. Instead the heavy jobs self-skip via job-level `if` — a
# skipped required check counts as passing, while Scope itself is required so
# a probe failure fails closed (its dependents skip, but Scope's own red X
# blocks the merge).
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      prisma: ${{ steps.diff.outputs.prisma }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          FILES=$(git diff --name-only "$BASE"...HEAD)
          echo "$FILES"
          # code=false only when every changed file is a surface with its own
          # gate (desktop → desktop.yml, website → lockstep check in Lint) or
          # pure docs/media. Anything unrecognized counts as code — new paths
          # fail toward running the full gate, never toward skipping it.
          CODE=false; PRISMA=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              website/*|docs/*|media/*|.tours/*|*.md|LICENSE|apps/desktop-mac/*) ;;
              *) CODE=true ;;
            esac
            case "$f" in
              packages/api/prisma/*|.github/workflows/ci.yml) PRISMA=true ;;
            esac
          done <<< "$FILES"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prisma=$PRISMA" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: biomejs/setup-biome@v2
        with:
          version: "2.4.12"
      - name: Run Biome lint (errors only)
        run: biome check --diagnostic-level=error packages/
      # website/ ships two full parallel landings (EN + KO) with no shared
      # template — structural edits must land in both. Fails on skeleton drift.
      - name: Website EN/KO lockstep
        run: bash .github/scripts/check-website-lockstep.sh

      - name: Web i18n locale parity
        run: node .github/scripts/check-i18n-parity.mjs

      # The product's claim is that you can see WHICH lane a message landed in.
      # A lane wearing another lane's colour is therefore a correctness bug, and
      # it shipped silently once already at the ontology v2 flip.
      - name: Lane identity
        run: node .github/scripts/check-lane-identity.mjs

      # Lane identity checks each lane owns a distinct hue; it cannot see that a
      # surface has forgotten a lane exists. The landings were corrected to five
      # lanes while the app still shipped four: the playground crashed on
      # MEETING and onboarding silently dropped MEETING and INFO mail.
      - name: Lane vocabulary
        run: node .github/scripts/check-lane-vocabulary.mjs

      # The landing renders the lanes TWICE from independent data — the hero
      # demo and the interactive replica below it — and neither guard above can
      # see a mismatch between them. Lockstep compares EN/KO structure; lane
      # identity covers packages/web, not website/. That gap shipped a frozen
      # Korean hero demo (#1242, fixed in #1243) with every check green.
      - name: Website lane consistency
        run: node .github/scripts/check-website-lanes.mjs

      # sitemap.xml is hand-maintained and had drifted both ways at once: it
      # submitted three noindex redirect stubs while omitting all ten /vs/*
      # and /open-source/ pages (#1219), whose only purpose is being found.
      - name: Sitemap coverage
        run: node .github/scripts/check-sitemap.mjs

      # P1 of the productization plan added the design tokens; P2 migrates onto
      # them. This ratchet keeps the gap from widening meanwhile: no new
      # text-[Npx], raw palette colours, raw <button> in app pages, or retired
      # AUTO lane styling. Per-file baseline counts can only go down.
      - name: Design tokens
        run: node .github/scripts/check-design-tokens.mjs

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: cd packages/api && pnpm exec prisma generate
      # Both go through the package `typecheck` script rather than a bare `tsc`
      # so CI and the CLAUDE.md gate run the SAME command. api's script carries
      # --max-old-space-size=4096 (same as its `build`): a bare `tsc --noEmit`
      # peaks just over 2 GB and aborts on any machine whose default heap is
      # 2 GB, so the documented local gate died where CI's roomier runner passed.
      - name: Typecheck API
        run: pnpm --filter @klorn/api typecheck
      # Web was previously unchecked here — a broken packages/web tsc slipped
      # through CI on 2026-07-03 (missing @capacitor/app types) because only
      # only api was gated. Next.js `build` type-checks too, but tsc is the
      # cheap fast signal on every PR.
      - name: Typecheck Web
        run: pnpm --filter @klorn/web typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: cd packages/api && pnpm exec prisma generate
      - name: Run tests
        run: cd packages/api && pnpm exec vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: cd packages/api && pnpm exec prisma generate
      - name: Build all packages
        run: pnpm -r build

  # Guards prod: prod deploys via `prisma migrate deploy` (start.sh), so a
  # schema.prisma change with no matching migration silently ships nothing and
  # breaks at runtime. This replays every migration into a throwaway Postgres and
  # fails if the result doesn't match schema.prisma — catching drift at PR time,
  # not deploy time.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.prisma == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check migrations match schema (no drift)
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code \
          || {
            echo "::error::schema.prisma and prisma/migrations have drifted. Generate a migration: cd packages/api && pnpm exec prisma migrate dev --name <change>";
            exit 1;
          }
