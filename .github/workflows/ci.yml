name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Heavy jobs run in PARALLEL behind a ~10s Scope probe, so PR wall-clock is the
# slowest single job (build), not the sum of a serial chain. The founder runs
# the full gate locally before pushing (CLAUDE.md ship workflow); CI is the
# backstop, so fail-fast ordering buys little and costs minutes.
#
# Scope exists because required checks + path filters don't mix on GitHub: a
# path-filtered workflow leaves its required checks "Expected" forever and the
# PR can never merge. Instead the heavy jobs self-skip via job-level `if` — a
# skipped required check counts as passing, while Scope itself is required so
# a probe failure fails closed (its dependents skip, but Scope's own red X
# blocks the merge).
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      prisma: ${{ steps.diff.outputs.prisma }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          FILES=$(git diff --name-only "$BASE"...HEAD)
          echo "$FILES"
          # code=false only when every changed file is a surface with its own
          # gate (desktop → desktop.yml, website → lockstep check in Lint) or
          # pure docs/media. Anything unrecognized counts as code — new paths
          # fail toward running the full gate, never toward skipping it.
          CODE=false; PRISMA=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              website/*|docs/*|media/*|.tours/*|*.md|LICENSE|apps/desktop-mac/*) ;;
              *) CODE=true ;;
            esac
            case "$f" in
              packages/api/prisma/*|.github/workflows/ci.yml) PRISMA=true ;;
            esac
          done <<< "$FILES"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prisma=$PRISMA" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.4.12"
      - name: Run Biome lint (errors only)
        run: biome check --diagnostic-level=error packages/
      # website/ ships two full parallel landings (EN + KO) with no shared
      # template — structural edits must land in both. Fails on skeleton drift.
      - name: Website EN/KO lockstep
        run: bash .github/scripts/check-website-lockstep.sh

      - name: Web i18n locale parity
        run: node .github/scripts/check-i18n-parity.mjs

      # The product's claim is that you can see WHICH lane a message landed in.
      # A lane wearing another lane's colour is therefore a correctness bug, and
      # it shipped silently once already at the ontology v2 flip.
      - name: Lane identity
        run: node .github/scripts/check-lane-identity.mjs

      # Lane identity checks each lane owns a distinct hue; it cannot see that a
      # surface has forgotten a lane exists. The landings were corrected to five
      # lanes while the app still shipped four: the playground crashed on
      # MEETING and onboarding silently dropped MEETING and INFO mail.
      - name: Lane vocabulary
        run: node .github/scripts/check-lane-vocabulary.mjs

      # The landing renders the lanes TWICE from independent data — the hero
      # demo and the interactive replica below it — and neither guard above can
      # see a mismatch between them. Lockstep compares EN/KO structure; lane
      # identity covers packages/web, not website/. That gap shipped a frozen
      # Korean hero demo (#1242, fixed in #1243) with every check green.
      - name: Website lane consistency
        run: node .github/scripts/check-website-lanes.mjs

      # website/ imports nothing from lib/pricing.ts, so the constant that was
      # created to stop the 2026-08-12 price drift ($7.99 advertised, $8.99
      # charged) could not actually see the pages doing the advertising. It
      # also catches the native price falling below the web one, which the
      # $8.99 → $29.99 raise did to PRO_PRICE_NATIVE on 2026-10-14.
      - name: Price consistency
        run: node .github/scripts/check-price-consistency.mjs

      # sitemap.xml is hand-maintained and had drifted both ways at once: it
      # submitted three noindex redirect stubs while omitting all ten /vs/*
      # and /open-source/ pages (#1219), whose only purpose is being found.
      - name: Sitemap coverage
        run: node .github/scripts/check-sitemap.mjs

      # Blog posts exist only in English, but the localized blog listings put
      # translated titles into their BlogPosting JSON-LD — declaring a French
      # or Korean headline for an English document. Visible titles stay
      # localized; structured data carries the post's English headline and
      # inLanguage "en", on every listing and on the post pages themselves.
      - name: Blog JSON-LD language
        run: node .github/scripts/check-blog-jsonld.mjs

      # P1 of the productization plan added the design tokens; P2 migrates onto
      # them. This ratchet keeps the gap from widening meanwhile: no new
      # text-[Npx], raw palette colours, raw <button> in app pages, or retired
      # AUTO lane styling. Per-file baseline counts can only go down.
      - name: Design tokens
        run: node .github/scripts/check-design-tokens.mjs

      # A tag or branch in `uses:` is mutable — whoever owns the upstream repo
      # can move it under a workflow holding our release secrets. Every action
      # is pinned to a commit SHA; Dependabot keeps the pins current.
      - name: Actions pinned to SHAs
        run: node .github/scripts/check-actions-pinned.mjs

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: cd packages/api && pnpm exec prisma generate
      # Both go through the package `typecheck` script rather than a bare `tsc`
      # so CI and the CLAUDE.md gate run the SAME command. api's script carries
      # --max-old-space-size=4096 (same as its `build`): a bare `tsc --noEmit`
      # peaks just over 2 GB and aborts on any machine whose default heap is
      # 2 GB, so the documented local gate died where CI's roomier runner passed.
      - name: Typecheck API
        run: pnpm --filter @klorn/api typecheck
      # Web was previously unchecked here — a broken packages/web tsc slipped
      # through CI on 2026-07-03 (missing @capacitor/app types) because only
      # only api was gated. Next.js `build` type-checks too, but tsc is the
      # cheap fast signal on every PR.
      - name: Typecheck Web
        run: pnpm --filter @klorn/web typecheck
      # packages/cli (`klorn`, the self-host operations CLI) has no build step —
      # bin/klorn.mjs runs src/ through tsx — so typecheck is its only tsc gate.
      - name: Typecheck CLI
        run: pnpm --filter @klorn/cli typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    env:
      # The CLI Postgres suite (packages/cli/src/__tests__/cli-pg.test.ts) shims
      # psql / pg_dump / pg_restore through `docker exec` into a container it
      # names, which a service container is not; it gets its own, below.
      CLI_IT_CONTAINER: klorn-cli-it-pg
      CLI_IT_PORT: "55433"
    # A real Postgres (production's major version) for the *-pg.test.ts suites:
    # the data-wipe fence's lock ordering and the attachment upserts cannot be
    # proven against a mock.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klorn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Started first so it boots while dependencies install. Postgres 16, the
      # self-host compose's major version. Pinned by digest (postgres:16.16,
      # the multi-arch index) because a tag can move under CI; Dependabot does
      # not read `docker run` lines, so the digest is bumped by hand. A
      # throwaway database: durability settings off for speed.
      - name: Start the CLI suite's Postgres 16
        run: |
          docker run -d --name "$CLI_IT_CONTAINER" \
            -e POSTGRES_PASSWORD=postgres \
            -p "127.0.0.1:$CLI_IT_PORT:5432" \
            postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: cd packages/api && pnpm exec prisma generate
      - name: Run tests
        run: cd packages/api && pnpm exec vitest run
      # The CLI unit suites fake child_process and the network. Its Postgres
      # suite (cli-pg.test.ts) self-skips here without KLORN_CLI_IT_*; the
      # last steps of this job run it.
      - name: Run CLI tests
        run: pnpm --filter @klorn/cli test
      - name: Run Postgres integration tests (every migration applied)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klorn_test
          KLORN_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/klorn_test
        run: |
          cd packages/api
          pnpm exec prisma migrate deploy
          pnpm exec vitest run pg.test.ts
      # After the API suites, so a red CLI suite never hides theirs.
      - name: Run the CLI Postgres suite
        timeout-minutes: 15
        env:
          KLORN_CLI_IT_CONTAINER: ${{ env.CLI_IT_CONTAINER }}
          KLORN_CLI_IT_BASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ env.CLI_IT_PORT }}
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          # Over TCP: the image's init-time server listens on the socket only,
          # so a TCP answer is the server that stays up.
          for _ in $(seq 1 30); do
            docker exec "$CLI_IT_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 2
          done
          docker exec "$CLI_IT_CONTAINER" pg_isready -h 127.0.0.1 -U postgres \
            || { docker logs "$CLI_IT_CONTAINER" || true; exit 1; }
          log="$RUNNER_TEMP/cli-pg.log"
          pnpm --filter @klorn/cli exec vitest run cli-pg --reporter=verbose 2>&1 | tee "$log"
          # A skipped suite exits 0: pass only on vitest's "Tests  N passed (M)"
          # line, which has no other count only when nothing skipped, failed
          # or was todo ("Tests  7 passed | 1 skipped (8)" does not match).
          grep -Eq '^[[:space:]]*Tests[[:space:]]+[0-9]+ passed \([0-9]+\)[[:space:]]*$' "$log" \
            || { echo "::error::the CLI Postgres suite did not run every test"; exit 1; }
      - name: Remove the CLI suite's Postgres
        if: always()
        run: docker rm -fv "$CLI_IT_CONTAINER" || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: cd packages/api && pnpm exec prisma generate
      # D5c: the Google Picker widens the web CSP only under the build switch
      # NEXT_PUBLIC_GOOGLE_DRIVE_PICKER=on. Loads the real next.config.ts (Node
      # 22 type stripping) and pins the policy with the switch unset and on.
      - name: Web CSP pinned (Google Picker switch)
        run: node packages/web/scripts/check-csp.mjs
      # Cloudflare Pages serves public/_headers and public/_redirects in place
      # of next.config.ts headers()/redirects(), which a static export cannot
      # run (docs/deploy/cloudflare-pages.md). Loads the real config and fails
      # on any drift — these are the headers the CASA DAST was assessed on.
      - name: Web Cloudflare _headers/_redirects match next.config.ts
        run: node --test packages/web/scripts/cloudflare-pages.test.mjs
      - name: Build all packages
        run: pnpm -r build
      # D5c: built without the switch, the web bundle holds no Google Picker
      # (google-drive-connect.tsx imports it behind the literal switch, which
      # next.config.ts always defines, so the bundler drops the import).
      - name: Web bundle holds no Google Picker without the switch
        run: |
          test -d packages/web/.next/static
          if grep -rl "apis.google.com/js/api.js" packages/web/.next/static; then
            echo "The Google Picker was compiled in without NEXT_PUBLIC_GOOGLE_DRIVE_PICKER=on"
            exit 1
          fi
      # The static export Cloudflare Pages deploys must keep building (it
      # builds into packages/web/out, so the server build above is untouched).
      # build:static ends with scripts/check-static-export.mjs (shells, 404,
      # _headers/_redirects vs this environment's config); the test -f lines
      # are the visible smoke.
      - name: Web static export (Cloudflare Pages)
        run: |
          pnpm --filter @klorn/web build:static
          test -f packages/web/out/index.html
          test -f packages/web/out/404.html
          test -f packages/web/out/email/_.html
          test -f packages/web/out/calendar/_.html
          test -f packages/web/out/email/candidates/_.html
          test -f packages/web/out/_headers
          test -f packages/web/out/_redirects

  # Guards prod: prod deploys via `prisma migrate deploy` (start.sh), so a
  # schema.prisma change with no matching migration silently ships nothing and
  # breaks at runtime. This replays every migration into a throwaway Postgres and
  # fails if the result doesn't match schema.prisma — catching drift at PR time,
  # not deploy time.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.prisma == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check migrations match schema (no drift)
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code \
          || {
            echo "::error::schema.prisma and prisma/migrations have drifted. Generate a migration: cd packages/api && pnpm exec prisma migrate dev --name <change>";
            exit 1;
          }
