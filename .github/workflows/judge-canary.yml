# Weekly judge canary (#769) — the always-on judge check on an unchanged codebase.
#
# The PR-gate eval (eval.yml) only fires when a PR touches judge files, so it
# cannot see a provider-side change or outage while the code stands still.
# Every Monday this canary:
#   1. ALARMS when the synthetic gate set misses a floor on both runs of
#      scripts/judge-gate.sh, or when the instrument is degraded (at least one
#      item fell to the keyword fallback, which cannot emit PUSH), and
#   2. REPORTS per-item verdict flips + per-floor margins on the real set
#      against last week's baseline (scripts/canary-compare.ts).
#
# Since 2026-10-31 the judge is Claude Haiku 5.5 (native Anthropic provider,
# as in prod). It takes no temperature, so the same items flip between runs of
# the same code (real set: 39/53 locally vs 38/53 in CI, eval/README.md). A
# flip no longer means the decision boundary moved, so flips are a readout,
# not an alarm, and the floors on the gate set carry the alarm instead.
#
# Cost: usually one gate-set run (56 items) + one real-set run (53) per week,
# ~110 Haiku calls at ≈ $0.0002 each; each re-run or retry adds one set.
#
# Baseline lifecycle: stored via actions/cache (rolling key) and refreshed on
# every scored run — with flips report-only there is nothing to hold it for.

name: Judge canary

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # The alarm step files/refreshes a tracking issue — a red run notifies nobody.
  issues: write

concurrency:
  group: judge-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Weekly judge canary (gate floors + provider reachability)
    runs-on: ubuntu-latest
    # The Anthropic secrets are set per step, only on the steps that call the
    # API — never on checkout, setup or install.
    env:
      # Anthropic only, so an outage reads as INSTRUMENT DEGRADED (exit 3)
      # instead of another model's score.
      LLM_PROVIDER_ORDER: anthropic
      JUDGE_MODEL: claude-haiku-5-5
      # There is no DB in this job; the Prisma client is constructed at
      # import time and just needs a syntactically valid URL.
      DATABASE_URL: "postgresql://eval:eval@localhost:5432/eval"
      # Disable the global daily ceiling (#1004): it reads GlobalCostLedger
      # before every paid call, and with no DB that throws and drops every
      # item to the keyword fallback (see eval.yml).
      GLOBAL_DAILY_COST_CAP_CENTS: "0"
      # Same reason: the ground-truth usage log write (llm-usage.ts) is
      # fire-and-forget but warns + Sentry-captures per call with no DB.
      LLM_USAGE_LOG_DISABLED: "true"
      # Match prod's flag state (#653) and the PR-gate eval (eval.yml).
      JUDGE_INCLUDE_BODY: "true"
    steps:
      # Fail closed: this workflow only runs on schedule/dispatch (no fork
      # PRs), so a missing secret means the tripwire is disarmed, not skipped.
      - name: Check for Anthropic key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::No ANTHROPIC_API_KEY secret — the weekly judge canary cannot run."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.present == 'true'

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma types
        if: steps.key.outputs.present == 'true'
        run: cd packages/api && npx prisma generate

      # The alarm: the gate set's floors, decided the same way as the PR gate
      # (one re-run on a floor failure, one retry on an outage). The exit code
      # tells the verdict and the alarm issue which failure it was.
      - name: Gate floors on the synthetic set
        if: steps.key.outputs.present == 'true'
        id: floors
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        continue-on-error: true
        run: |
          cd packages/api
          set +e
          bash scripts/judge-gate.sh eval/judge-eval-set.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Restore previous baseline
        if: steps.key.outputs.present == 'true'
        uses: actions/cache/restore@v4
        with:
          path: canary-baseline.json
          # The exact key never matches (run_id is unique); the prefix
          # restore-key resolves to the most recently saved baseline.
          key: judge-canary-baseline-${{ github.run_id }}
          restore-keys: |
            judge-canary-baseline-

      # Readout only. The real set breaches per-tier floors by design (PUSH
      # n=4, report-only until support ≥10 — see eval/README.md), and a floor
      # breach exits 2 but still writes --out. Exit 3 (INSTRUMENT DEGRADED)
      # writes no --out, so fallback verdicts never become a baseline.
      - name: Score the real set (report-only)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        continue-on-error: true
        run: |
          cd packages/api
          set +e
          npx tsx scripts/poc-accuracy.ts \
            --in=eval/real-eval-set.json --concurrency=2 --delay=500 \
            --out=../../canary-current.json
          code=$?
          if [ "$code" = "3" ]; then
            echo "::warning::Instrument degraded (provider unreachable) — retrying once in 60s"
            sleep 60
            npx tsx scripts/poc-accuracy.ts \
              --in=eval/real-eval-set.json --concurrency=2 --delay=500 \
              --out=../../canary-current.json
            code=$?
          fi
          exit $code

      - name: Compare against baseline (report-only)
        if: steps.key.outputs.present == 'true'
        id: compare
        continue-on-error: true
        run: |
          if [ ! -f canary-current.json ]; then
            echo "::warning::The real set produced no output — nothing to compare."
            exit 1
          fi
          if [ ! -f canary-baseline.json ]; then
            echo "::notice::No baseline found — recording this run as the first baseline."
            exit 0
          fi
          cd packages/api && npx tsx scripts/canary-compare.ts \
            --prev=../../canary-baseline.json --curr=../../canary-current.json

      - name: Check score output
        if: steps.key.outputs.present == 'true'
        id: scored
        run: |
          if [ -f canary-current.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save new baseline
        if: steps.key.outputs.present == 'true' && steps.scored.outputs.ok == 'true'
        run: cp canary-current.json canary-baseline.json

      - name: Persist baseline to cache
        if: steps.key.outputs.present == 'true' && steps.scored.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: canary-baseline.json
          key: judge-canary-baseline-${{ github.run_id }}

      - name: Verdict
        if: steps.key.outputs.present == 'true'
        env:
          FLOORS_CODE: ${{ steps.floors.outputs.code }}
          SCORED: ${{ steps.scored.outputs.ok }}
          COMPARE: ${{ steps.compare.outcome }}
        run: |
          if [ "$SCORED" != "true" ]; then
            echo "::warning::The real-set readout produced no output — see the 'Score the real set' step."
          elif [ "$COMPARE" != "success" ]; then
            echo "::notice::The real-set comparison found verdict flips or could not compare (report-only: the judge takes no temperature) — see the 'Compare against baseline' step."
          fi
          case "$FLOORS_CODE" in
            0)
              echo "Canary green — the gate set clears every floor."
              ;;
            3)
              echo "::error::Judge canary: instrument degraded on both attempts — at least one item fell to the keyword fallback (provider error, credit, rate limit). See the 'Gate floors on the synthetic set' step."
              exit 1
              ;;
            2)
              echo "::error::Judge canary: the gate set missed a floor on both runs — see the 'Gate floors on the synthetic set' step."
              exit 1
              ;;
            *)
              echo "::error::Judge canary: the gate step exited '${FLOORS_CODE}' — see the 'Gate floors on the synthetic set' step."
              exit 1
              ;;
          esac

      # A tripwire nobody sees is not a tripwire. The 2026-07-26 provider
      # failure sat red for a week: this canary is the only always-on detector
      # (eval.yml fires only when a PR touches judge files) and a failed
      # scheduled run notifies no one. File one tracking issue and keep
      # commenting on it, so the alarm accumulates in a single thread instead
      # of spawning a new issue every Monday.
      - name: Open or refresh the alarm issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          FLOORS_CODE: ${{ steps.floors.outputs.code }}
        run: |
          if [ "$KEY_PRESENT" != "true" ]; then
            reason="the ANTHROPIC_API_KEY repo secret is missing, so the canary could not run at all"
          elif [ "$FLOORS_CODE" = "2" ]; then
            reason="the synthetic gate set missed a floor (overall ≥80%, PUSH recall ≥90%, SILENT precision ≥90%) on both runs, on an unchanged codebase"
          elif [ "$FLOORS_CODE" = "3" ]; then
            reason="instrument degraded — at least one item fell to the keyword fallback on both attempts, so the scores measure the fallback, not the judge"
          else
            reason="a workflow step outside the scoring failed (gate step exit '${FLOORS_CODE:-not reached}')"
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Weekly judge canary failed: ${reason}." \
            "Run: ${RUN_URL}" \
            "The keyword fallback caps confidence at 0.55 and the PUSH rule floor is 0.7 (packages/api/src/judge/tier-policy.ts), so while the instrument is degraded PUSH cannot be emitted at all — for the canary and for prod. First check the Anthropic key (credit balance, workspace spend limit, rate limit, validity), then re-run this workflow.")
          gh label create judge-canary --color B60205 --description "Weekly judge canary alarm" 2>/dev/null || true
          # `run:` executes under `bash -e`: an empty/failed lookup must not
          # abort the step before the issue is filed.
          existing=$(gh issue list --label judge-canary --state open --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Judge canary alarm" --label judge-canary --body "$body"
          fi
