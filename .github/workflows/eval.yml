name: Judge Eval

# LLM accuracy gate for the judge, measured on the model prod serves first:
# Claude Haiku 5.5 through the native Anthropic provider (prod runs
# LLM_PROVIDER_ORDER=anthropic,openrouter since 2026-10-30). Runs the committed
# synthetic set (packages/api/eval/judge-eval-set.json) through the LLM
# pipeline and fails when a floor is missed (overall ≥80%, PUSH recall ≥90%,
# SILENT precision ≥90% — see packages/api/src/eval-floors.ts). The judge
# takes no temperature, so scripts/judge-gate.sh re-runs once on a floor
# failure; the decision table is pinned by src/__tests__/judge-gate-script.test.ts.
#
# Anthropic is the ONLY provider in this job: a provider failure drops items to
# the keyword fallback and the run reports INSTRUMENT DEGRADED (exit 3) instead
# of silently measuring another model. The OpenRouter job that measured
# google/gemini-2.5-flash was removed on 2026-10-31 — prod no longer serves
# that model first (eval/README.md, "CI measures Claude").
#
# This complements the deterministic gate that always runs in CI tests
# (src/__tests__/judge-eval-set.test.ts — fast-path + keyword fallback,
# no keys needed). Fork PRs don't receive secrets, so this job degrades
# to a skip-with-notice instead of a false failure.

on:
  workflow_dispatch:
  pull_request:
    paths:
      # The classifier now lives under src/judge/ (module slice 7, see
      # docs/api-module-map.md). Watch the whole module: any judge change
      # must run the eval floor, and a per-file list here silently stops
      # firing when a file moves.
      - "packages/api/src/judge/**"
      # The gate is the only LLM check on the provider path the judge runs
      # through (native Anthropic adapter, createCompletion, model gate) — an
      # adapter bug once scored every feature 0 while logging success.
      - "packages/api/src/providers/**"
      - "packages/api/src/llm/**"
      - "packages/api/src/eval-floors.ts"
      - "packages/api/eval/**"
      - "packages/api/scripts/judge-gate.sh"
      - "packages/api/scripts/poc-accuracy.ts"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-eval:
    name: LLM judge accuracy — Claude Haiku 5.5 (overall ≥80%, PUSH recall ≥90%, SILENT precision ≥90%)
    runs-on: ubuntu-latest
    # The Anthropic secrets are set per step, only on the steps that call the
    # API — never on checkout, setup or install.
    env:
      LLM_PROVIDER_ORDER: anthropic
      JUDGE_MODEL: claude-haiku-5-5
      # There is no DB in this job; the Prisma client is constructed at
      # import time and just needs a syntactically valid URL.
      DATABASE_URL: "postgresql://eval:eval@localhost:5432/eval"
      # The global daily ceiling (#1004) reads GlobalCostLedger before every
      # paid call. With no DB that read throws, every item drops to the
      # keyword fallback, and the gate exits 3 (INSTRUMENT DEGRADED) on every
      # run. Cap 0 short-circuits before the DB read (cost-guard.ts) — the
      # eval measures the judge, not billing infrastructure.
      GLOBAL_DAILY_COST_CAP_CENTS: "0"
      # Same reason: the ground-truth usage log write (llm-usage.ts) is
      # fire-and-forget but warns + Sentry-captures per call with no DB.
      LLM_USAGE_LOG_DISABLED: "true"
      # Match prod's flag state (#653 flipped body ON): the gate measures the
      # judge as deployed. Inert on the committed synthetic set (no `body`
      # fields) until the body-bearing eval set (#648) lands — see #650.
      JUDGE_INCLUDE_BODY: "true"
    steps:
      - name: Check for Anthropic key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANTHROPIC_API_KEY in this context (fork PR?) — skipping LLM eval. The deterministic eval gate still runs in the CI test job."
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.present == 'true'

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma types
        if: steps.key.outputs.present == 'true'
        run: cd packages/api && npx prisma generate

      - name: Live adapter smoke (report-only)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: only for a key not scoped to a workspace.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          cd packages/api
          npx tsx scripts/anthropic-smoke.ts || echo "::warning::Anthropic adapter smoke failed — see this step's log"

      # Exit 3 (provider unreachable) is retried once after a pause; exit 2
      # (floor failure) is re-run once because the judge takes no temperature.
      # Token totals per run come from the usage tap (no mail content).
      - name: Run judge accuracy gate
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: only for a key not scoped to a workspace.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          cd packages/api
          NODE_OPTIONS="--import $PWD/scripts/anthropic-usage-tap.mjs" \
            bash scripts/judge-gate.sh eval/judge-eval-set.json

      # Report-only readout on the REAL founder-labeled set (#648). The
      # original GO/NO-GO bar (≥80% overall on real mail) is measured on every
      # judge PR. Claude Haiku 5.5 scored 39/53 (73.6%) on 2026-10-30, below
      # that bar: 13 of 14 misses are QUEUE/SILENT predicted as INFO, a lane
      # the v1-labelled set has no truth for (eval/README.md). Per-tier floors stay
      # NON-gating until PUSH support reaches ≥10 (at n=4 the 0.90 recall
      # floor demands 4/4 — coin-flip statistics, not a gate). Ratchet: when
      # the regenerated set has the support, point the gate step above at
      # real-eval-set.json and delete this one.
      - name: Real-mail readout (report-only)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: only for a key not scoped to a workspace.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          cd packages/api
          NODE_OPTIONS="--import $PWD/scripts/anthropic-usage-tap.mjs" \
            npx tsx scripts/poc-accuracy.ts --in=eval/real-eval-set.json --concurrency=2 --delay=500 \
            || echo "::warning::Real-mail readout exited non-zero (2 = floors not met, report-only until PUSH support ≥10; 3 = instrument degraded) — numbers are in this step's log"
