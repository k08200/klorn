# Publish the self-host container images to GitHub Container Registry.
#
# Trigger: push a tag like `v0.4.0`, or run manually via workflow_dispatch.
#
# Why this exists: docker-compose.selfhost.yml used to build both services from
# source, so trying Klorn meant a full toolchain build. Published images turn
# that into `docker compose up -d`. They are also the only measurable signal of
# self-host adoption — the product's own analytics write to each deployment's
# own Postgres and are invisible to us by design, so ghcr pull counts are the
# one number we can actually see.
#
# NOTE on the web image: NEXT_PUBLIC_API_URL is inlined into the client bundle
# at BUILD time (Dockerfile.web), so the published image is fixed to the
# compose default (http://localhost:3001). That is correct for the common
# single-host case. Anyone serving beyond localhost still rebuilds — see
# docs/self-hosting.md.
#
# After the FIRST successful run: flip both packages to Public in GitHub
# package settings (they default to private, which hides pull counts and
# blocks anonymous pulls).

name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # `klorn upgrade <version>` (packages/cli) pulls the images tagged <version>
  # and waits for /api/health to report it, and the API reports the version in
  # packages/api/package.json. An image published under any other tag can never
  # finish an upgrade, so a tag build stops here before anything is built or
  # pushed. A manual dispatch from a branch publishes only `latest` and skips it.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches packages/api/package.json
        if: github.ref_type == 'tag'
        run: node .github/scripts/check-release-version.mjs "$GITHUB_REF_NAME"

  publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag-push runs emit semver tags + latest; a manual dispatch (no tag)
      # emits only `latest`, so a dispatch from main refreshes latest without
      # minting a fake version.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 included deliberately: a large share of self-hosters run
          # Apple Silicon or ARM SBCs. It builds under QEMU and is slow — drop
          # it to linux/amd64 if CI minutes become the constraint.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
