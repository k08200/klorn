# CI for the mobile app (apps/mobile): the bundled React app, then the two
# native shells that wrap it. Path-filtered so it only spends runners when the
# mobile app or the wire contract it imports changes. Signing and store upload
# live in mobile-release.yml; nothing here needs a secret.
name: Mobile

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/contract/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/contract/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  app:
    name: App — typecheck, test, build, screenshots
    # Pinned: Playwright ships no Chromium for ubuntu-latest's 26.04 image yet
    # ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium and CJK fonts for screenshots
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Device screenshots (phone, Flip cover, Fold, iPad, light + dark)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: apps/mobile/test-results/
          if-no-files-found: ignore

  android:
    name: Android — debug build
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # Capacitor 8's Android libraries compile to Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Native unit tests and debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: klorn-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS — simulator build
    needs: app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        working-directory: .
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
