services:
  - type: web
    name: klorn-api
    runtime: node
    region: singapore
    plan: free
    # Pin Node's heap for the build. The api `tsc` build needs >2GB; Render's
    # builder sizes Node's default heap around 2GB (CI/GitHub runners have more
    # RAM, so their auto-default is higher — which is why CI passed while Render
    # failed with "JavaScript heap out of memory" once the codebase grew past
    # ~2GB, deploy log 2026-07-14). Setting it explicitly makes the build
    # independent of the builder's RAM-derived default.
    buildCommand: |
      corepack enable &&
      export NODE_OPTIONS=--max-old-space-size=4096 &&
      pnpm install --frozen-lockfile --prod=false &&
      cd packages/api && npx prisma generate && pnpm build
    # preDeployCommand intentionally omitted — start.sh runs prisma migrate
    # deploy with cold-start retry, so a separate preDeploy pass duplicates
    # that work AND its hang risk. The 2026-06-05 deploy timed out at 15min
    # silently between preDeploy and startCommand; collapsing into a single
    # migrate-with-retry path (start.sh) makes the failure mode visible
    # in the container logs.
    startCommand: cd packages/api && pnpm start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # SINGLE PROVIDER (founder decision, 2026-08-02): hosted prod runs on one
      # OpenRouter key. The Gemini secondary was retired, so this key has NO
      # failover — see the privacy note below for why the :free net is off too.
      # Operational consequence: keep the balance funded (OpenRouter Auto Top-Up)
      # and watch the judge-health alarm; a 402/403/429 here degrades every LLM
      # surface at once.
      - key: OPENROUTER_API_KEY
        sync: false
      # Required for the observability tripwires to reach anyone: judge-health
      # (fleet-wide keyword-fallback rate) and the key-headroom probe both
      # report via captureError, which is a NO-OP when SENTRY_DSN is unset
      # (sentry.ts initSentry). Declared here so an empty value is visible in
      # the dashboard instead of silently disabling every alarm.
      - key: SENTRY_DSN
        sync: false
      # LLM model pins — make prod explicit instead of relying on the in-code
      # defaults (which intentionally stay :free for self-hosters without paid
      # credit). Prod runs on a funded OpenRouter key, so every user-facing
      # surface is unified on the reliable paid flash model; per-user load is
      # billed to each user's own key when set (BYOK), and the per-user cost cap
      # (DAILY_COST_CAP_CENTS) backstops the shared key. Model names are public,
      # not secrets — pinned in-repo.
      #
      # Privacy (Limited Use / no-train): hosted prod NEVER degrades onto :free
      # OpenRouter endpoints — their hosts may train on request data (verified
      # 2026-07-03: gemma-4-31b-it:free routes via Google AI Studio free tier +
      # OpenInference). The account-level OpenRouter toggle "Free endpoints that
      # may train on request data" must ALSO stay off. With the Gemini secondary
      # retired there is nothing left to fail over to, so on 402 the request
      # fails outright and the judge drops to the keyword fallback (which caps
      # confidence at 0.55 and cannot emit PUSH) — that is the accepted trade
      # for the no-train commitment, not an oversight. Self-host keeps the :free
      # net by default (operator's own data-policy choice).
      # Chat/assistant default = frontier (user-selectable in Settings from the
      # curated catalog; this is the default for users who never picked).
      - key: CHAT_MODEL
        value: "anthropic/claude-sonnet-5"
      - key: AGENT_MODEL
        value: "google/gemini-2.5-flash"
      - key: JUDGE_MODEL
        value: "google/gemini-2.5-flash"
      - key: VISION_MODEL
        value: "google/gemini-2.5-flash"
      # Global daily LLM ceiling, in cents. Sized for ~100 active users; raise
      # it deliberately as the number grows, don't discover it as an outage.
      #
      # Measured 2026-08-04 from the OpenRouter key's own ledger: $10.005 spent
      # over ~3.5 months (created 2026-04-17), i.e. ~$2.9/month for one dogfood
      # account — and of the visible window, 85% went to CHAT_MODEL
      # (claude-sonnet-5, $2.71) against 15% for the whole triage pipeline
      # (gemini-2.5-flash, $0.49). Triage is cheap; conversation is not.
      #
      # 100 users × ~50 classified emails/day is a few dollars a day on the
      # flash model; chat is the variable. 3000¢ = $30/day leaves room for that
      # mix while still capping a runaway loop at a survivable number. The
      # per-user gate ($1/day, DAILY_COST_CAP_CENTS) bounds any single account,
      # and the key's own monthly budget is the final hard stop below both.
      #
      # This ceiling is only real because it is now DB-backed (GlobalCostLedger)
      # — as an in-memory counter it reset on every deploy and every wake from
      # idle, which is why BACKGROUND_AGENTS_DISABLED had to serve as the brake
      # instead, disabling every scheduler with it.
      - key: GLOBAL_DAILY_COST_CAP_CENTS
        value: "3000"
      - key: DISABLE_FREE_MODEL_FALLBACK
        value: "true"
      # #653/#655: flipped by founder decision (2026-07-09) ahead of the formal
      # body-bearing eval harness (#648/#650) — the synthetic eval set carries no
      # body so this stays inert under CI either way (poc-judge.ts
      # isJudgeBodyEnabled). Validation is live dogfooding on real mail rather
      # than a held-out eval, by choice. Adds a 1500-char truncated plaintext
      # body to the judge prompt (JUDGE_BODY_CAP) — expected to close a chunk of
      # the measured PUSH recall gap (46% on the snippet-only pipeline).
      - key: JUDGE_INCLUDE_BODY
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: PUSH_RECEIPT_BASE_URL
        sync: false
      - key: PORT
        value: "3001"
      - key: CORS_ORIGINS
        value: "https://klorn.ai,https://www.klorn.ai,https://app.klorn.ai"
      - key: RENDER_EXTERNAL_URL
        value: "https://klorn-api.onrender.com"
      # iCloud Mail connect + sync (Phase 2, multi-provider plan). OFF until
      # the CASA Letter of Assessment is issued — while unset/false, every
      # /api/icloud-imap route 404s and the poll never selects ICLOUD rows.
      - key: ICLOUD_INBOX_ENABLED
        sync: false
      # Attention aging sweep — OFF until deliberately flipped (what leaves
      # the firewall board is a product decision).
      - key: ATTENTION_AGING_ENABLED
        sync: false
      # Kill switch for the activity-driven mail pull (ships ON).
      - key: ACTIVITY_MAIL_SYNC_DISABLED
        sync: false
      # Outlook via Microsoft Graph OAuth (Phase 3). Same CASA freeze: while
      # unset/false every /api/auth/outlook route 404s. Client credentials
      # come from the Azure app registration (set in the dashboard).
      - key: OUTLOOK_INBOX_ENABLED
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_REDIRECT_URI
        sync: false
      # Prod-critical runtime config — declared (sync:false) so a blueprint sync
      # can never PRUNE them. Previously these lived only in the Render dashboard
      # and got dropped on redeploy, which silently disabled Web Push (the PUSH
      # tier went dark — set the value once in the dashboard; it now persists).
      # Values are set in the Render dashboard, not committed here.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: "mailto:k0820086@gmail.com"
      # Token-at-rest encryption + Google OAuth client — ADDITIVE declarations
      # (sync:false, no values), same prune-protection pattern as the VAPID
      # block above: these are required for the API to boot/log in but were
      # previously dashboard-only, so a blueprint sync could PRUNE them.
      # Declaring them (a) preserves the existing dashboard values on sync
      # (sync:false is never overwritten by the blueprint) and (b) makes a
      # fresh Deploy-to-Render self-host prompt for them at create time
      # instead of crash-looping on a missing TOKEN_ENCRYPTION_KEY
      # (packages/api/src/crypto-tokens.ts fails closed outside dev/test).
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Real-time Gmail push (else the scheduler falls back to polling).
      - key: GMAIL_PUBSUB_TOPIC
        sync: false
      # Pub/Sub push RECEIVER auth — without one of these the push
      # endpoint 503s every delivery and realtime mail dies while the
      # watch side looks healthy. Declared (sync:false) so a blueprint
      # sync can never PRUNE the dashboard values (VAPID incident
      # pattern, 2026-08-10 diagnosis). Values live in the dashboard.
      - key: GMAIL_PUSH_TOKEN
        sync: false
      - key: GMAIL_PUSH_OIDC_EMAIL
        sync: false
      # Public URL, not a secret — committed so realtime setup is one field
      # (the OIDC service-account email) away. Must match the Pub/Sub push
      # subscription's explicit Audience (runbook Mode B).
      - key: GMAIL_PUSH_OIDC_AUDIENCE
        value: https://klorn-api.onrender.com/api/gmail/push
      # Free-dyno keepalive ping target (else the dyno sleeps and misses pushes).
      - key: KEEPALIVE_URL
        sync: false
      # Admin allowlist for /api/diagnostics + decision-metrics (override watch).
      - key: ADMIN_EMAILS
        sync: false
